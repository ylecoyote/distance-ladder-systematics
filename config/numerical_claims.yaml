verification:
  description: Configuration for manuscript consistency checks
  categories:
  - name: tension
    severity: ERROR
    description: Tension evolution consistency across CSV, figures, tables, README
  - name: systematics
    severity: ERROR
    description: Systematic budget calculations and ratios
  - name: h0_compilation
    severity: WARNING
    description: H₀ compilation and multi-method convergence
  - name: figures
    severity: WARNING
    description: Figure package integrity and timestamps
  - name: manuscript
    severity: INFO
    description: Manuscript vs README consistency
  fail_fast:
    enabled: false
    on_severity: ERROR
