tolerances:
  h0: 0.01
  sigma: 0.01
  tension: 0.05
  ratio: 0.02
tension_evolution:
  description: Progressive reduction of Hubble tension through systematic corrections
  planck:
    h0: 67.36
    sigma: 0.54
  stages:
  - stage: 1
    name: Statistical only
    h0: 73.04
    sigma: 0.8
    tension: 5.9
    description: Baseline SH0ES H₀ with statistical uncertainty only
  - stage: 2
    name: Quoted SH0ES sys. + stat.
    h0: 73.04
    sigma: 1.31
    tension: 4.0
    description: Reconstructed from SH0ES statistical uncertainty plus quoted systematic budget
  - stage: 3
    name: Scenario A (Parallax ZP)
    h0: 73.04
    sigma: 1.31
    tension: 4.0
    description: 'Scenario A parallax handling on top of the reconstructed SH0ES budget'
  - stage: 4
    name: Period distribution
    h0: 70.54
    sigma: 1.65
    tension: 1.8
    description: Explicit period distribution modeling (−2.5 km/s/Mpc)
  - stage: 5
    name: Metallicity + Realistic σ
    h0: 69.54
    sigma: 1.89
    tension: 1.1
    description: Metallicity correction (Prior 1) + realistic systematic budget
  summary:
    initial_tension: 5.9
    final_tension: 1.1
    reduction_factor: 5.3
systematic_budget:
  description: Systematic uncertainty components and quadrature sums
  shoes:
    uncorrelated: 1.04
    correlated: 1.04
    components:
    - name: Parallax zero point
      value: 0.3
    - name: Period distribution
      value: 0.0
    - name: Metallicity correction
      value: 0.4
    - name: Crowding (blending)
      value: 0.5
    - name: Photometric calibration
      value: 0.3
    - name: Extinction reddening
      value: 0.4
    - name: LMC distance
      value: 0.2
    - name: NGC4258 distance
      value: 0.2
    - name: SNe Ia standardization
      value: 0.5
  our_assessment:
    uncorrelated: 1.45
    correlated: 1.71
    components:
    - name: Parallax zero point
      value: 0.3
    - name: Period distribution
      value: 1.0
    - name: Metallicity correction
      value: 0.5
    - name: Crowding direct
      value: 0.3
    - name: Photometric calibration
      value: 0.3
    - name: Extinction reddening
      value: 0.5
    - name: LMC distance
      value: 0.2
    - name: NGC4258 distance
      value: 0.2
    - name: SNe Ia standardization
      value: 0.5
  ratios:
    uncorrelated: 1.4
    correlated: 1.65
    range:
    - 1.39
    - 1.65
  correlations:
    baseline_rho: 0.3
    pairs:
    - name: Period-Metallicity
      i: 1
      j: 2
      rho: 0.3
    - name: Metallicity-Crowding
      i: 2
      j: 3
      rho: 0.2
    - name: Metallicity-Extinction
      i: 2
      j: 5
      rho: 0.3
    - name: Crowding-Extinction
      i: 3
      j: 5
      rho: 0.3
    - name: Photometry-Extinction
      i: 4
      j: 5
      rho: 0.2
    - name: Metallicity-SNe
      i: 2
      j: 8
      rho: 0.2
    - name: Extinction-SNe
      i: 5
      j: 8
      rho: 0.15
  citation_sources:
    description: Literature sources supporting systematic uncertainty estimates
    period_distribution:
      empirical_evidence:
      - name: Ngeow2006
        citation: Ngeow & Kanbur (2006), MNRAS 363:831
        contribution: LMC Cepheids F-test rejection of linear P-L at p<0.001
        doi: 10.1111/j.1365-2966.2005.09477.x
      - name: Kodric2015
        citation: Kodric et al. (2015), MNRAS 451:724
        contribution: M31 independent confirmation of broken P-L relations
        doi: 10.1093/mnras/stv873
      theoretical_mechanism:
      - name: Anderson2016
        citation: Anderson et al. (2016), ApJS 226:18
        contribution: Period-dependent rotation effects in Cepheid populations
      wesenheit_counterargument:
      - name: Ngeow2005
        citation: Ngeow & Kanbur (2005), MNRAS 360:1033
        contribution: Showed optical Wesenheit W(V,I) linearizes despite broken component
          P-L relations; however only tested optical, not W^H_{V,I}
        doi: 10.1111/j.1365-2966.2005.09109.x
      - name: Bhardwaj2016
        citation: Bhardwaj et al. (2016), MNRAS 457:1644
        contribution: NIR Wesenheit W^H_{V,I} nonlinear at ~18 days (different from
          optical 10-day break); Wesenheit reduces but does not eliminate slope breaks
        doi: 10.1093/mnras/stw122
      - name: Wojtak2024
        citation: Wojtak & Hjorth (2024), MNRAS 538:2838
        contribution: Period-bin analysis yields H0=72.50±1.69, consistent with SH0ES;
          but flagged optical period-dependent trend of ~11.4±3.5 km/s/Mpc/dex
        doi: 10.1093/mnras/staf435
      - name: Hogas2025
        citation: Hogås & Mörtsell (2025), MNRAS 538:883
        contribution: Matched-period resampling yields H0=72.18±1.76 (~1 km/s/Mpc
          downward); broken PLR yields H0=72.35±0.91 (p<0.001 vs linear);
          directly targets anchor-host period mismatch
        doi: 10.1093/mnras/staf308
      shoes_variant_tests:
        description: Riess et al. 2022 Table 5 explicit period-form tests
        fit_24_break_10d:
          h0_shift: -0.45
          slope_difference: 0.10 +/- 0.05
        fit_25_p_gt_10d:
          h0_shift: +0.1
        fit_26_p_lt_60d:
          h0_shift: +1.0
        baseline_period_range: 5 < P < 120 days
      statistical_significance: p<0.001 (Ngeow2006 F-tests)
      correction_value: -2.5
      uncertainty: 1.0
    metallicity_correction:
      primary_sources:
      - name: Riess2022
        value: -0.2
        contribution: SH0ES Cepheid distance ladder
      - name: Freedman2025a
        value: -0.17
        uncertainty: 0.11
        contribution: JWST/NIRCam TRGB-based calibrations (consistent with zero at
          1.5σ)
      - name: Freedman2001
        value_range:
        - -0.3
        - -0.2
        contribution: HST Key Project calibrations
      prior_1_baseline: -0.2
      prior_1_uncertainty: 0.1
      justification: Genuine between-study empirical scatter, not measurement error
h0_compilation:
  description: Multi-method H₀ measurements and convergence analysis
  three_method_convergence:
    name: Planck + JAGB + CC convergence
    h0: 67.48
    sigma: 0.5
    description: Three independent methods converge at 67.5 ± 0.5 km/s/Mpc
    methods:
    - Planck CMB
    - JAGB
    - Cosmic Chronometers (H(z))
  planck_independent:
    name: JAGB + Cosmic Chronometers
    h0: 68.22
    sigma: 1.36
    description: Planck-independent distance ladder + H(z) convergence
  methods:
  - name: Planck CMB
    h0: 67.36
    sigma: 0.54
    category: Early Universe
  - name: JAGB
    h0: 67.96
    sigma: 2.65
    category: Distance Ladder
  - name: Cosmic Chronometers (H(z))
    h0: 68.33
    sigma: 1.57
    category: Model-Independent
  - name: Corrected Cepheid (Scenario A + Prior 1)
    h0: 69.54
    sigma: 1.89
    category: Distance Ladder
  - name: TRGB
    h0: 69.85
    sigma: 2.33
    category: Distance Ladder
  - name: SH0ES Cepheid
    h0: 73.04
    sigma: 1.04
    category: Distance Ladder
correlation_sensitivity:
  description: Sensitivity of systematic budget to correlation assumptions
  extended_sweep:
    rho_range:
    - 0.0
    - 0.8
    tension_range:
    - 1.05
    - 1.23
    description: All tensions remain <2σ across full ρ range
    max_tension:
      value: 1.23
      rho: 0.0
      pair: Period-Metallicity
    min_tension:
      value: 1.05
      rho: 0.8
      pair: Period-Metallicity
