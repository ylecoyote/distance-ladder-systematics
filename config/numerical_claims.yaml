# =============================================================================
# Tolerances for Numerical Comparisons
# =============================================================================
tolerances:
  h0: 0.01          # km/s/Mpc - H₀ values
  sigma: 0.01       # km/s/Mpc - Uncertainty values
  tension: 0.05     # σ units - Tension calculations
  ratio: 0.02       # Dimensionless - Systematic budget ratios

# =============================================================================
# Tension Evolution (Figure 1, Table 2, README)
# =============================================================================
tension_evolution:
  description: "Progressive reduction of Hubble tension through systematic corrections"

  # Planck 2018 reference
  planck:
    h0: 67.36       # km/s/Mpc
    sigma: 0.54     # km/s/Mpc

  # Five stages of tension reduction
  stages:
    - stage: 1
      name: "Statistical only"
      h0: 73.04      # km/s/Mpc
      sigma: 0.80    # km/s/Mpc (statistical only)
      tension: 5.9   # σ
      description: "Baseline SH0ES H₀ with statistical uncertainty only"

    - stage: 2
      name: "SH0ES total"
      h0: 73.04      # km/s/Mpc
      sigma: 1.31    # km/s/Mpc (stat ⊕ sys: √(0.80² + 1.04²))
      tension: 4.0   # σ
      description: "SH0ES published total uncertainty"

    - stage: 3
      name: "Scenario A (Parallax ZP)"
      h0: 73.04      # km/s/Mpc (no bias correction in Scenario A)
      sigma: 1.31    # km/s/Mpc
      tension: 4.0   # σ
      description: "Conservative parallax zero-point (Scenario A: no bias correction)"

    - stage: 4
      name: "Period distribution"
      h0: 70.54      # km/s/Mpc (−2.5 km/s/Mpc correction)
      sigma: 1.65    # km/s/Mpc (√(0.80² + 1.04² + 1.0²))
      tension: 1.9   # σ
      description: "Explicit period distribution modeling (−2.5 km/s/Mpc)"

    - stage: 5
      name: "Metallicity + Realistic σ"
      h0: 69.54      # km/s/Mpc (−1.0 km/s/Mpc metallicity correction)
      sigma: 1.89    # km/s/Mpc (√(0.80² + 1.71²))
      tension: 1.1   # σ
      description: "Metallicity correction (Prior 1) + realistic systematic budget"

  # Key claims for README/Abstract
  summary:
    initial_tension: 5.9   # σ (Stage 1)
    final_tension: 1.1     # σ (Stage 5)
    reduction_factor: 5.4  # 5.9 / 1.1 ≈ 5.4×

# =============================================================================
# Systematic Error Budget (Figure 2, Table S1)
# =============================================================================
systematic_budget:
  description: "Systematic uncertainty components and quadrature sums"

  # SH0ES 2022 systematic budget
  shoes:
    uncorrelated: 1.04    # km/s/Mpc (quadrature sum of SH0ES components)
    correlated: 1.04      # km/s/Mpc (SH0ES is a published value, not recalculated)
    components:
      - name: "Parallax zero point"
        value: 0.3        # km/s/Mpc
      - name: "Period distribution"
        value: 0.0        # km/s/Mpc (SH0ES doesn't model explicit period distribution)
      - name: "Metallicity correction"
        value: 0.4        # km/s/Mpc
      - name: "Crowding (blending)"
        value: 0.5        # km/s/Mpc
      - name: "Photometric calibration"
        value: 0.3        # km/s/Mpc
      - name: "Extinction reddening"
        value: 0.4        # km/s/Mpc
      - name: "LMC distance"
        value: 0.2        # km/s/Mpc
      - name: "NGC4258 distance"
        value: 0.2        # km/s/Mpc
      - name: "SNe Ia standardization"
        value: 0.5        # km/s/Mpc

  # Our Assessment (Scenario A + Prior 1)
  our_assessment:
    uncorrelated: 1.45    # km/s/Mpc (ρ=0, quadrature sum)
    correlated: 1.71      # km/s/Mpc (ρ=0.3 baseline, with correlation matrix)
    components:
      - name: "Parallax zero point"
        value: 0.3        # km/s/Mpc (Scenario A: conservative)
      - name: "Period distribution"
        value: 1.0        # km/s/Mpc (explicit bracket mid-range)
      - name: "Metallicity correction"
        value: 0.5        # km/s/Mpc (Prior 1: γ=-0.2±0.1)
      - name: "Crowding direct"
        value: 0.3        # km/s/Mpc (JWST validated)
      - name: "Photometric calibration"
        value: 0.3        # km/s/Mpc
      - name: "Extinction reddening"
        value: 0.5        # km/s/Mpc
      - name: "LMC distance"
        value: 0.2        # km/s/Mpc (geometric anchor)
      - name: "NGC4258 distance"
        value: 0.2        # km/s/Mpc (maser)
      - name: "SNe Ia standardization"
        value: 0.5        # km/s/Mpc

  # Systematic budget ratios (Figure 2, 6, 7)
  ratios:
    uncorrelated: 1.40    # Our/SH0ES (1.45/1.04 ≈ 1.4×)
    correlated: 1.65      # Our/SH0ES (1.71/1.04 ≈ 1.6×)
    range: [1.39, 1.65]   # Min (ρ=0) to max (ρ=0.3)

  # Correlation matrix baseline (ρ=0.3)
  correlations:
    baseline_rho: 0.3
    pairs:
      - name: "Period-Metallicity"
        i: 1
        j: 2
        rho: 0.3
      - name: "Metallicity-Crowding"
        i: 2
        j: 3
        rho: 0.2
      - name: "Metallicity-Extinction"
        i: 2
        j: 5
        rho: 0.3
      - name: "Crowding-Extinction"
        i: 3
        j: 5
        rho: 0.3
      - name: "Photometry-Extinction"
        i: 4
        j: 5
        rho: 0.2
      - name: "Metallicity-SNe"
        i: 2
        j: 8
        rho: 0.2
      - name: "Extinction-SNe"
        i: 5
        j: 8
        rho: 0.15

  # Citation provenance for systematic components
  citation_sources:
    description: "Literature sources supporting systematic uncertainty estimates"

    period_distribution:
      empirical_evidence:
        - name: "Ngeow2006"
          citation: "Ngeow & Kanbur (2006), MNRAS 363:831"
          contribution: "LMC Cepheids F-test rejection of linear P-L at p<0.001"
          doi: "10.1111/j.1365-2966.2005.09477.x"
        - name: "Kodric2015"
          citation: "Kodric et al. (2015), MNRAS 451:724"
          contribution: "M31 independent confirmation of broken P-L relations"
          doi: "10.1093/mnras/stv873"
      theoretical_mechanism:
        - name: "Anderson2016"
          citation: "Anderson et al. (2016), ApJS 226:18"
          contribution: "Period-dependent rotation effects in Cepheid populations"
      statistical_significance: "p<0.001 (Ngeow2006 F-tests)"
      correction_value: -2.5  # km/s/Mpc
      uncertainty: 1.0        # km/s/Mpc

    metallicity_correction:
      primary_sources:
        - name: "Riess2022"
          value: -0.2        # mag/dex
          contribution: "SH0ES Cepheid distance ladder"
        - name: "Freedman2025a"
          value: -0.17       # mag/dex
          uncertainty: 0.11  # mag/dex
          contribution: "JWST/NIRCam TRGB-based calibrations (consistent with zero at 1.5σ)"
        - name: "Freedman2001"
          value_range: [-0.3, -0.2]  # mag/dex
          contribution: "HST Key Project calibrations"
      prior_1_baseline: -0.2  # mag/dex (consensus baseline)
      prior_1_uncertainty: 0.1  # mag/dex
      justification: "Genuine between-study empirical scatter, not measurement error"

# =============================================================================
# H₀ Compilation and Multi-Method Convergence (Figure 4, Table 3)
# =============================================================================
h0_compilation:
  description: "Multi-method H₀ measurements and convergence analysis"

  # Three-method convergence (Planck + JAGB + Cosmic Chronometers)
  three_method_convergence:
    name: "Planck + JAGB + CC convergence"
    h0: 67.48         # km/s/Mpc (inverse-variance weighted mean)
    sigma: 0.50       # km/s/Mpc (√(1/Σw_i))
    description: "Three independent methods converge at 67.5 ± 0.5 km/s/Mpc"
    methods:
      - "Planck CMB"
      - "JAGB"
      - "Cosmic Chronometers (H(z))"

  # Planck-independent convergence (JAGB + CC only)
  planck_independent:
    name: "JAGB + Cosmic Chronometers"
    h0: 68.22         # km/s/Mpc
    sigma: 1.36       # km/s/Mpc
    description: "Planck-independent distance ladder + H(z) convergence"

  # Individual methods (for reference)
  methods:
    - name: "Planck CMB"
      h0: 67.36
      sigma: 0.54
      category: "Early Universe"

    - name: "JAGB"
      h0: 67.96
      sigma: 2.65
      category: "Distance Ladder"

    - name: "Cosmic Chronometers (H(z))"
      h0: 68.33
      sigma: 1.57
      category: "Model-Independent"

    - name: "Corrected Cepheid (Scenario A + Prior 1)"
      h0: 69.54
      sigma: 1.89
      category: "Distance Ladder"

    - name: "TRGB"
      h0: 69.85
      sigma: 2.33
      category: "Distance Ladder"

    - name: "SH0ES Cepheid"
      h0: 73.04
      sigma: 1.31
      category: "Distance Ladder"

# =============================================================================
# Correlation Sensitivity Analysis (Figures 6, 7, Extended Analysis)
# =============================================================================
correlation_sensitivity:
  description: "Sensitivity of systematic budget to correlation assumptions"

  # Extended sweep results (ρ ∈ [0.0, 0.8])
  extended_sweep:
    rho_range: [0.0, 0.8]
    tension_range: [1.05, 1.23]  # σ (min to max across all pairs)
    description: "All tensions remain <2σ across full ρ range"

    max_tension:
      value: 1.23       # σ
      rho: 0.0          # At uncorrelated limit
      pair: "Period-Metallicity"

    min_tension:
      value: 1.05       # σ
      rho: 0.8          # At strong correlation limit
      pair: "Period-Metallicity"

